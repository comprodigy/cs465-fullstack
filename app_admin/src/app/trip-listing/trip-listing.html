<div class="container mt-4">
  <div class="mb-3">
    <button class="btn btn-primary" (click)="addTrip()">Add Trip</button>
  </div>

  <div class="row">
    <div *ngFor="let trip of trips$ | async" class="col-md-4 mb-4">
      <app-trip-card [trip]="trip"></app-trip-card>
    </div>
  </div>
</div>
